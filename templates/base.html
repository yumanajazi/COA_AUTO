<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>COA Automation by YUMAN</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
  <header class="top">
    <div class="brand">COA&#8209;AUTO By YUMAN</div>
    <ol class="steps">
      {% for n, label in [(1,'Upload'),(2,'Review'),(3,'Customize'),(4,'Download')] %}
        <li class="{{ 'on' if step == n }}{{ ' done' if step and n < step }}"><span>{{ n }}</span>{{ label }}</li>
      {% endfor %}
    </ol>
  </header>
  <main class="{{ main_class|default('') }}">
    {% if error %}<div class="alert">{{ error }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
